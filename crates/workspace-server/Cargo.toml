[package]
name = "workspace-server"
description = "HTTP API, MCP server and authentication"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
web-ui = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
ring.workspace = true
base64.workspace = true
openidconnect.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
uuid.workspace = true
thiserror.workspace = true
rust-embed = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }
axum.workspace = true
tokio.workspace = true
serde.workspace = true
tracing.workspace = true
tower = "0.5"
workspace-core.workspace = true
workspace-runtime.workspace = true
rmcp = { version = "3.11.0", features = ["server", "transport-streamable-http-server"] }

[dev-dependencies]
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"
tempfile.workspace = true
tower.workspace = true
