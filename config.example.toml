[server]
listen = "127.0.0.1:8765"

[storage]
data_dir = "data"
max_import_mib = 256

[resources]
cpu_millis = 2000
memory_mib = 4096
storage_mib = 40960
max_active_workspaces = 3
max_concurrent_jobs = 1
max_processes_per_workspace = 256
max_job_seconds = 3600

[workspace]
default_mode = "ephemeral"
idle_timeout_seconds = 300
ttl_seconds = 86400
artifact_ttl_seconds = 86400

[network]
default_mode = "none"
# Lowercase hostnames reachable through the trusted egress proxy. With a
# non-empty allowlist, `default_mode = "allowlist"` puts workspaces on an
# internal Docker network whose only route is that proxy. Plain HTTP, IP
# literals, LAN, metadata and non-listed hosts are always denied.
allowlist = []
# egress_binary = "/srv/alxprgs-workspace/bin/workspace-egress"

[logging]
level = "info"

# Dedicated execution runtime (stage 008). Execution stays disabled unless this
# section names the dedicated backend explicitly. There are no fallbacks: the
# server never discovers Docker Desktop or another engine on its own.
#
# [runtime]
# backend = "wsl2"                       # or "rootless_docker" on Linux
# distro = "ALXPRGS-Workspace"
# user = "workspace"
# docker_path = "/usr/bin/docker"
# engine_name = "alxprgs-workspace"
# socket = "unix:///run/user/1000/docker.sock"
# data_root = "/srv/alxprgs-workspace/data"
# helper_path = "/srv/alxprgs-workspace/bin/workspace-helper"
# startup_timeout_seconds = 120
# command_timeout_seconds = 60
# workspace_storage_mib = 8192
# workspace_files = 200000
# minimum_free_mib = 4096
# base_image = "debian@sha256:8aa5a7bf5a1955bddbe7d74fcdd0b91ab30e74362a8b73af672b0481b35b44a0"

# Optional ALXPRGS SSO configuration:
#
# [sso]
# issuer = "https://auth.alxprgs.tech"
# client_id = "your-client-id"
# redirect_uri = "https://workspace.example.com/auth/callback"
#
# trusted_proxies lists reverse-proxy addresses whose X-Forwarded-For header is
# believed when rate limiting sign-in attempts per client. Leave it empty (the
# default) unless a proxy in front of Workspace is under your control.
# trusted_proxies = ["127.0.0.1", "::1"]

# Optional MCP gateway (stage 007). The gateway is disabled unless this
# section exists; without a declared audience no MCP endpoint is served.
#
# [mcp]
# issuer = "https://workspace.example.com"
# audience = "https://workspace.example.com/chatgpt/mcp"
# resource = "https://workspace.example.com/chatgpt/mcp"
# required_scopes = ["workspace.read"]
