[workspace]
resolver = "3"
members = [
    "crates/workspace-core",
    "crates/workspace-runtime",
    "crates/workspace-server",
    "crates/workspace-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/alxprgstech/workspace"
authors = ["ALXPRGS"]

[workspace.dependencies]
rust-embed = { version = "8", features = ["debug-embed"] }
mime_guess = "2"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
workspace-server = { path = "crates/workspace-server" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
workspace-core = { path = "crates/workspace-core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
